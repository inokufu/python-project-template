# Note: This file applies to the Python project template itself.
# Projects generated from this template have their own version of this file.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ":arrow_up:"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ":arrow_up:"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ":arrow_up:"
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
        update-types: [minor, patch]
